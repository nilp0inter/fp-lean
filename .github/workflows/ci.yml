name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for the main branch or for release branches
  push:
    branches:
      - 'master'
      - 'release/*'
    tags:
      - '*'
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This workflow builds pull request code, including code from forks, so it holds
# no secrets and only reads. The book HTML leaves here as an artifact, and
# deploy.yml picks it up and publishes it.
permissions:
  contents: read

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - name: Install a C compiler
        run: sudo apt-get install -y build-essential

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The book runs a Python interpreter during the build and shows its
      # output, so the version is pinned to keep that output stable.
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.15.0

      - name: Setup elan toolchain on this build
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none

      - name: Set elan paths
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install lean toolchain for examples
        run: |
          cd examples
          lean --version

      - name: Install lean toolchain for text
        run: |
          cd book
          lean --version

      - name: Cache examples/.lake
        uses: actions/cache@v6.1.0
        with:
          path: examples/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}
          # Try to restore cache for same OS/Lean/deps, but don't get less specific, because Lake isn't always happy to get build product version mismatches
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-

      - name: Cache book/.lake
        uses: actions/cache@v6.1.0
        with:
          path: book/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('book/lake-manifest.json') }}-${{ hashFiles('book/lean-toolchain') }}-${{ github.sha }}
          # Try to restore cache for same OS/Lean/deps, but don't get less specific, because Lake isn't always happy to get build product version mismatches
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('book/lake-manifest.json') }}-${{ hashFiles('book/lean-toolchain') }}-

      - name: Build example code
        run: |
          pushd examples
          lake build
          lake build subverso-extract-mod
          popd

      - name: Save examples/.lake
        uses: actions/cache/save@v6.1.0
        with:
          path: examples/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}

      - name: Build book
        run: |
          pushd book
          lake exe fp-lean --depth 2 --without-html-single --verbose
          popd

      - name: Save book/.lake
        uses: actions/cache/save@v6.1.0
        with:
          path: book/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('book/lake-manifest.json') }}-${{ hashFiles('book/lean-toolchain') }}-${{ github.sha }}

      # This is to get the cached highlight JSON files
      - name: Save examples/.lake again
        uses: actions/cache/save@v6.1.0
        with:
          path: examples/.lake
          # The SHA is in the key to get the most recent cache possible, rather than just saving a single one for each Lean/deps version and not touching it.
          key: ${{ runner.os }}-${{ hashFiles('examples/lake-manifest.json') }}-${{ hashFiles('examples/lean-toolchain') }}-${{ github.sha }}

      - name: Upload book HTML
        uses: actions/upload-artifact@v7.0.2
        with:
          name: book-html
          path: book/_out/html-multi
          retention-days: 7
          if-no-files-found: error

  pdf:
    name: Build book PDF
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the book-html artifact from the build job
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pandoc
        # The math conversion was verified with pandoc 3.7.0.2. The version is
        # pinned so a new pandoc cannot silently change generated Typst math;
        # bump it together with a re-verified conversion.
        uses: pandoc/actions/setup@v1.1.1
        with:
          version: 3.7.0.2

      - name: Install Typst
        # Same reasoning: pagination and layout were verified with 0.15.1.
        uses: typst-community/setup-typst@v5.3.2
        with:
          typst-version: 0.15.1

      - name: Download book HTML
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-html
          path: book/_out/html-multi

      - name: Convert HTML to Typst
        run: python3 typst/convert.py

      - name: Compile PDF
        run: |
          set -euo pipefail
          typst compile --root . --font-path book/static/fonts \
            typst/book.typ typst/fp-lean.pdf 2> typst/compile-book.log
          if [ -s typst/compile-book.log ]; then
            echo "::error::typst emitted diagnostics:"
            cat typst/compile-book.log
            exit 1
          fi

      - name: Upload book PDF
        uses: actions/upload-artifact@v7.0.2
        with:
          name: book-pdf
          path: typst/fp-lean.pdf
          retention-days: 7
          if-no-files-found: error
