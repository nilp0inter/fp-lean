name: Publish PDF release

# Attaches the Typst PDF that CI built to a GitHub Release. This workflow runs
# in the base repository, takes the build artifact as its only input, and acts
# on pushes of release- tags only, mirroring the Netlify publishing in
# deploy.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  release:
    name: Publish PDF on GitHub Releases
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'release-')
    runs-on: ubuntu-latest
    concurrency:
      group: pdf-publish-production
      cancel-in-progress: false
    permissions:
      actions: read # download the artifact belonging to the CI run
      contents: write # create the release and upload its asset
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Download book PDF
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-pdf
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Functional Programming in Lean (${{ env.TAG }})
          body: >-
            PDF edition of the book, typeset with Typst from the HTML that CI
            built from tag `${{ env.TAG }}`.
          files: dist/fp-lean.pdf
          fail_on_unmatched_files: true
